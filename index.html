<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Miss You</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #fff0f5 0%, #ffe4ec 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(255, 105, 135, 0.18);
      max-width: 380px;
      width: 88%;
      text-align: center;
      position: relative;
      z-index: 10;
      transition: transform 0.25s ease;
    }

    .card:active {
      transform: scale(0.98);
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      overflow: hidden;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .text {
      margin-top: 16px;
      font-size: 1.25rem;
      font-weight: 600;
      color: #ff3366;
    }

    .hint {
      margin-top: 6px;
      font-size: 0.85rem;
      color: #888;
      transition: all 0.3s ease;
    }

    /* Анимация сердечек */
    .heart {
      position: fixed;
      bottom: -30px;
      user-select: none;
      pointer-events: none;
      animation: floatUp 3.2s linear forwards;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.6);
      }
      20% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-110vh) scale(1.4) rotate(20deg);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="video-wrapper">
      <!-- Подключаем именно ваш love.mp4 -->
      <video id="myVideo" src="love.mp4" loop playsinline muted autoplay></video>
    </div>

    <div class="text">I Miss You ❤</div>
    <div class="hint" id="hint">Нажми на экран, чтобы включить звук 🔊</div>
  </div>

  <script>
    const video = document.getElementById('myVideo');
    const hint = document.getElementById('hint');
    let soundEnabled = false;

    // Включение звука и сердечек по нажатию в любое место экрана
    function handleScreenClick() {
      if (!soundEnabled) {
        video.muted = false;
        video.currentTime = 0;
        video.play();
        soundEnabled = true;
        hint.innerText = "Звук включён ✨";
        hint.style.color = "#ff3366";
        startHearts();
      } else {
        // Повторный клик ставит на паузу / возобновляет
        if (video.paused) {
          video.play();
          hint.innerText = "Звук включён ✨";
        } else {
          video.pause();
          hint.innerText = "Пауза ⏸️";
        }
      }
    }

    document.body.addEventListener('click', handleScreenClick);

    // Генерация сердечек
    function spawnHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      const icons = ['❤️', '💖', '💕', '💗'];
      heart.innerText = icons[Math.floor(Math.random() * icons.length)];
      heart.style.left = Math.random() * 92 + 'vw';
      heart.style.fontSize = Math.floor(Math.random() * 16 + 18) + 'px';
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 3200);
    }

    function startHearts() {
      setInterval(spawnHeart, 350);
    }
  </script>

</body>
</html>
